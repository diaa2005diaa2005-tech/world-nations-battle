<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WORLD NATIONS BATTLE</title>
  <style>
    body {
      margin: 0;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 18px;
    }
    h1 {
      color: #ffd54a;
      font-size: 28px;
      margin-bottom: 6px;
    }
    h3 {
      margin-top: 0;
    }
    .timer {
      font-size: 40px;
      color: #19e68c;
      font-weight: bold;
      margin: 20px 0;
    }
    .country {
      background: #142b45;
      margin: 12px auto;
      padding: 14px;
      border-radius: 12px;
      max-width: 450px;
    }
    .name {
      font-size: 21px;
      margin-bottom: 6px;
    }
    .points {
      color: #ffd54a;
      font-size: 22px;
      margin: 8px 0;
      font-weight: bold;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .like {
      background: #26c6da;
      color: #071426;
    }
    .gift {
      background: #ffc107;
      color: #071426;
    }
    input {
      padding: 12px;
      border-radius: 8px;
      border: none;
      width: 65%;
      max-width: 240px;
      margin: 6px;
    }
    .add {
      background: #39e69a;
      color: #071426;
    }
    #result {
      color: #ffd54a;
      font-size: 22px;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>🌍 WORLD NATIONS BATTLE</h1>
  <h3>🔥 حرب الأمم العالمية 🔥</h3>
  <div class="timer" id="timer">10:00</div>
  <div id="countries"></div>
  <h3 id="result">🏆 المنافسة بدأت!</h3>
  <hr />
  <h3>➕ إضافة دولة</h3>
  <input id="countryName" placeholder="اكتب اسم الدولة" />
  <button class="add" onclick="addCountry()">إضافة</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaRASHTlefNqVM7i_zCXPPoMWNetsPew",
      authDomain: "world-nations-battle.firebaseapp.com",
      databaseURL: "https://world-nations-battle-default-rtdb.firebaseio.com",
      projectId: "world-nations-battle",
      storageBucket: "world-nations-battle.firebasestorage.app",
      messagingSenderId: "676383197510",
      appId: "1:676383197510:web:954bc0c60dfc1c05016b56"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const defaultCountries = [
      { name: "العراق 🇮🇶", points: 0 },
      { name: "السعودية 🇸🇦", points: 0 },
      { name: "مصر 🇪🇬", points: 0 },
      { name: "المغرب 🇲🇦", points: 0 }
    ];

    let countries = [...defaultCountries];
    let seconds = 600;
    let isInitialized = false;

    const battleRef = ref(db, "worldNationsBattle");

    function saveState() {
      set(battleRef, {
        countries: countries,
        seconds: seconds
      });
    }

    function render() {
      const sorted = [...countries].sort((a, b) => b.points - a.points);
      document.getElementById("countries").innerHTML = sorted
        .map((c, i) => {
          const originalIndex = countries.findIndex(item => item.name === c.name);
          return `
            <div class="country">
              <div class="name">${i + 1}. ${c.name}</div>
              <div class="points">${c.points} نقطة</div>
              <button class="like" onclick="score(${originalIndex}, 1)">❤️ +1</button>
              <button class="gift" onclick="score(${originalIndex}, 100)">🎁 +100</button>
            </div>
          `;
        })
        .join("");
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
      const secs = String(seconds % 60).padStart(2, "0");
      document.getElementById("timer").innerText = `${mins}:${secs}`;
    }

    window.score = function(index, pts) {
      if (!countries[index]) return;
      countries[index].points += pts;
      render();
      saveState();
    };

    window.addCountry = function() {
      const input = document.getElementById("countryName");
      const name = input.value.trim();
      if (!name) return;
      if (countries.some(c => c.name.toLowerCase() === name.toLowerCase())) return;
      countries.push({ name: name, points: 0 });
      input.value = "";
      render();
      saveState();
    };

    function round() {
      const winner = countries.reduce((a, b) => (a.points > b.points ? a : b));
      document.getElementById("result").innerText = `🏆 الفائز: ${winner.name}!`;
      countries.forEach(c => (c.points = 0));
      seconds = 600;
      render();
      saveState();
    }

    function tick() {
      if (!isInitialized) return;
      seconds--;
      if (seconds <= 0) {
        round();
      } else {
        updateTimerDisplay();
        if (seconds % 5 === 0) {
          set(ref(db, "worldNationsBattle/seconds"), seconds);
        }
      }
    }

    onValue(battleRef, (snapshot) => {
      const data = snapshot.val();
      if (data && Array.isArray(data.countries)) {
        countries = data.countries;
        if (typeof data.seconds === "number") {
          seconds = data.seconds;
        }
      } else if (!isInitialized) {
        saveState();
      }
      isInitialized = true;
      render();
      updateTimerDisplay();
    });

    setInterval(tick, 1000);
    render();
    updateTimerDisplay();
  </script>
</body>
</html>
